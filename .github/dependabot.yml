# Keep GitHub Actions current automatically.
#
# Why this file exists: on 2026-07-26 a fleet-wide scan found 25 of 26 repos had
# no dependabot at all, and every one of them was a full MAJOR version behind on
# actions/checkout, setup-python and friends. A moving tag like `@v5` only moves
# inside its own major line — once v6 ships, `@v5` is frozen and nothing says so.
#
# Schedule: dependabot has no "biweekly" interval, and cron has no week-parity
# field either, so "every two weeks" is expressed as the 1st and 15th. Fixed
# dates on purpose — a true 14-day cycle drifts across weekdays over time.
#
# grouped on purpose: the default (one PR per action) turns into a drizzle of
# PRs to triage. One bundled PR per run is reviewable in a single pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Added 2026-08-31. github-actions was the only ecosystem here, so nothing
  # watched this repo's Python manifest. Fleet-wide that blind spot let
  # `anthropic>=0.40` (unbounded) resolve to 1.2.0 on the day the SDK shipped
  # its first major — a dependency swap (httpx -> httpx2) that CI could not
  # have caught, because it never runs the code path that imports it.
  #
  # Scope note: dependabot reads manifests. A pin written inline in a workflow
  # (`pip install ruff==X`) is invisible to every ecosystem and still needs a
  # human — see the tool pins in .github/workflows/.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
