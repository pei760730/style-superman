# Keep GitHub Actions current automatically.
#
# Why this file exists: on 2026-07-26 a fleet-wide scan found 25 of 26 repos had
# no dependabot at all, and every one of them was a full MAJOR version behind on
# actions/checkout, setup-python and friends. A moving tag like `@v5` only moves
# inside its own major line — once v6 ships, `@v5` is frozen and nothing says so.
#
# Schedule: dependabot has no "biweekly" interval, and cron has no week-parity
# field either, so "every two weeks" is expressed as the 1st and 15th. Fixed
# dates on purpose — a true 14-day cycle drifts across weekdays over time.
#
# grouped on purpose: the default (one PR per action) turns into a drizzle of
# PRs to triage. One bundled PR per run is reviewable in a single pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Added 2026-08-31. github-actions was the only ecosystem here, so nothing
  # watched this repo's Python manifest. Fleet-wide that blind spot let
  # `anthropic>=0.40` (unbounded) resolve to 1.2.0 on the day the SDK shipped
  # its first major — a dependency swap (httpx -> httpx2) that CI could not
  # have caught, because it never runs the code path that imports it.
  #
  # Scope note: dependabot reads manifests, so a pin written inline in a
  # workflow (`pip install ruff==X`) is invisible to every ecosystem. That
  # blind spot was real here: ruff sat on 0.16.4 for 17 days (0.16.5 and
  # 0.16.6 both shipped) while client forks — which keep ruff in a manifest —
  # got their bump PRs automatically. Fixed 2026-09-06 by moving the tool pins
  # into requirements-dev.txt, which this ecosystem does see. Keep them there:
  # anything pinned back inside a `run:` step stops being watched.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
    ignore:
      # pytest 9.0.0 raised requires_python to >=3.10, but this repo supports
      # 3.9 (CLAUDE.md: the owner's Mac only has python3, and it is 3.9; the
      # ci.yml matrix runs 3.9 too). 8.4.2 is the last release that admits 3.9.
      #
      # Why ignore rather than let it come and go red: the python group above
      # bundles every pip update into ONE PR. A pytest 9 entry would make that
      # PR red, which blocks the legitimate ruff bumps riding along with it.
      #
      # This is a convenience, not the guard — ignore rules have leaked before
      # on range-style specs. The real guard is smoke (3.9) in ci.yml, which
      # actually runs the code. When 3.9 support is dropped, remove this entry,
      # the ci.yml matrix floor, and the ceiling note in requirements-dev.txt
      # together.
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
