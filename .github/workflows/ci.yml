name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# 同一分支/PR 連續 push 時，取消還在跑的舊 run，只留最新——省 Actions 額度
# （AI 高頻 push 是額度主要消耗）。master 與各 PR 是不同 ref，各自成組、互不取消。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 不設就是吃 360 分鐘預設；smoke 離線、實測 <1 分，pip/runner 抖動掛住時
    # 一次 hang = 2（matrix）× 360 分私有 repo 額度。
    timeout-minutes: 10
    # 擁有者 Mac 是 3.9 floor、本機是唯一產線（D16 後 brief 走對話、D35 後 flash 亦走對話）。
    # CI 必須在 3.9 也跑，否則 3.10+ 語法/stdlib 會 CI 綠卻在擁有者本機才炸（守錯門）。
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2  # CI-only；最新支援 Python 3.9 的 pytest 系列

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      # CI-only lint：不進 requirements.txt、不上產線（擁有者 2026-06-16 放行）。
      # 抓 AI 改碼最常見、與測試正交的回歸：未定義名稱 / 未用 import / 壞 f-string。
      # --target-version py39 同時幫驗 3.9 相容語法。
      - name: Lint (ruff, CI-only)
        run: |
          python -m pip install ruff==0.16.0  # pin 紀律:升版走專門 PR 連 code 一起修(2026-07-25 已升,17 條違規同 PR 清零)
          python -m ruff check --target-version py39 scripts tests

      # 單一驗收入口：validate_repo / repo_health / track_rankings /
      # generate_* 全部由 test_smoke 內部執行一次。pytest 必須收集到它，避免 0 tests 假綠。
      - name: Acceptance smoke tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -s tests/test_smoke.py
