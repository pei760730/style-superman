name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# 同一分支/PR 連續 push 時，取消還在跑的舊 run，只留最新——省 Actions 額度
# （AI 高頻 push 是額度主要消耗）。master 與各 PR 是不同 ref，各自成組、互不取消。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 不設就是吃 360 分鐘預設；smoke 離線、實測 <1 分，pip/runner 抖動掛住時
    # 一次 hang = 2（matrix）× 360 分私有 repo 額度。
    timeout-minutes: 10
    # 擁有者 Mac 是 3.9 floor、本機是唯一產線（D16 後 brief 走對話、D35 後 flash 亦走對話）。
    # CI 必須在 3.9 也跑，否則 3.10+ 語法/stdlib 會 CI 綠卻在擁有者本機才炸（守錯門）。
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          # CI/dev 工具（pytest、ruff）的釘版在 requirements-dev.txt，不寫在這裡：
          # 寫在 run: 裡的 `pip install X==Y` 對任何 dependabot ecosystem 都是隱形的，
          # 腐爛沒有機制在守（2026-09-06 實測 ruff 落後 17 天沒人發現）。
          python -m pip install -r requirements-dev.txt

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      # CI-only lint：不進 requirements.txt、不上產線（擁有者 2026-06-16 放行）。
      # 抓 AI 改碼最常見、與測試正交的回歸：未定義名稱 / 未用 import / 壞 f-string。
      # --target-version py39 同時幫驗 3.9 相容語法。
      # 版本釘在 requirements-dev.txt（升版紀律與 3.9 上限的理由都寫在那個檔）。
      - name: Lint (ruff, CI-only)
        run: python -m ruff check --target-version py39 scripts tests

      # 收集整個 tests/：test_smoke 是端到端驗收入口（validate_repo / repo_health /
      # track_rankings / generate_* 全由它內部各跑一次）；同目錄另有 scripts 的離線單元測試。
      # 這裡必須指向目錄而非單檔——寫死單檔會讓新增的測試檔在 CI 一次都不執行（2026-08-18 實測
      # #217 併入 9 檔 1,179 行後 CI 收集數未變），那是比 0 tests 更難察覺的假綠。
      - name: Acceptance smoke tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -s tests/
