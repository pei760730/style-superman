# 單品調研（prompts/item_research.md）的離線對照組。
# 全部是合成資料：品牌、價格、量測、網址都是編的（網址用 .invalid 保證點不開、不會被誤當真站）。
# 基準衣量測也是合成值，不是擁有者的身體或衣物資料——真基準只在對話裡給，不進 repo。
#
# 用法（無 LLM API，D5）：改 prompts/item_research.md 後，在對話裡把每個 case 的 turns 依序貼給 agent，
# 照下方 rubric 逐條打勾，跟上一次的結果比。不是 pytest 會讀的檔。

captured_at: "2026-10-09T23:55+08:00"   # 所有快照的凍結時間（動態資訊一律以此為「查詢時間」）

# 合成基準：「我已經有、穿起來剛好」的衣物量測。對話裡由擁有者提供一次，之後不該再被問。
reference:
  top:    {label: "基準上衣（合成）", 身幅: 57, 肩寬: 48, 袖長: 62, 着丈: 74}
  bottom: {label: "基準長褲（合成）", 腰: 88, 渡り: 34, 股上: 30, 股下: 76, 裾幅: 22}
  tolerance_note: "差 ±2cm 內視為同感；身幅 +4cm 以上開始明顯寬鬆；腰 -2cm 以上會緊"

