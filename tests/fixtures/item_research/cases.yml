cases:
  - id: no-tag
    tests: 無標籤、型號不可斷言、照片可確認/可能/待確認三層
    turns:
      - "（貼拍賣截圖：S1）這件要買嗎？我基準上衣量測在之前給過了。"
  - id: wool-blend
    tests: 羊毛混紡要標出含毛比例；不擴張成排斥棉麻
    turns:
      - "（貼 S2 連結）這件燕麥色針織好看，買 3 還是 4？"
  - id: same-model-sizes
    tests: 同款不同尺碼，依基準量測選碼，不靠標籤
    turns:
      - "（貼 S3）這件 BD 襯衫 2 跟 3 選哪個？"
  - id: two-fits
    tests: 兩件不同版型，量測對基準逐項比；S4b 含毛要提但只提一次
    turns:
      - "（貼 S4a、S4b）這兩條褲子哪條比較適合我？"
  - id: conflict
    tests: 賣家說法與官方規格矛盾，分開陳述、不替任何一方定案
    turns:
      - "（貼 S5a 拍賣、S5b 官方舊款頁）這件 Harrington 值得嗎？"
  - id: price-unknown
    tests: 價格未知不准推成便宜或稀有；只問會改變決定的資訊
    turns:
      - "（貼 S6）這件古著 rugby 怎樣？"
  - id: compare-3
    tests: 三件比較：先前三名排序+理由、再表格；偏好說明只出現一次
    turns:
      - "（貼 S7 三件）這三件針織選哪件？"
  - id: compare-8
    tests: 八件比較：先 Top3、表格收全部、缺資料欄標待確認、不把『同款?』講成同款
    turns:
      - "（貼 S8 八件截圖）幫我挑。"
  - id: size-added-later
    tests: 先無量測 → 後補量測：第二輪只更新尺寸結論、不重問已給資訊
    turns:
      - "（貼一件只寫 Size M、無量測、綿100%、¥7,500 的二手 overshirt 截圖）這件可以嗎？"
      - "賣家回了：身幅 56、肩寬 47、袖長 60、着丈 73。"

# 每則回覆逐條打勾；「次數」類越少越好，0 為目標。
rubric:
  - R1 第一行就是推薦程度＋具體原因（單件）／前三名＋理由（多件）
  - R2 多件比較有表格，缺資料的格寫「待確認」不是留白或猜值
  - R3 尺寸結論引用「商品量測 vs 基準量測」的差值；沒有量測時明說無法判斷
  - R4 重問已提供資訊（次數）
  - R5 提問數 ≤2，且每題都能說出「答案會怎麼改變買不買」
  - R6 把照片/賣家推測講成確定型號、年代、產地（次數）
  - R7 無標籤時分「照片能確認／可能款式／仍待確認」
  - R8 來源分賣家說法／官方規格／自行推測；價格與庫存附查詢時間
  - R9 把查不到講成便宜、稀有、保值（次數）
  - R10 羊毛（含混紡）有標出比例；沒有把棉、麻等一併排斥（擴張次數）
  - R11 偏好說明在同一則回覆出現次數（目標 ≤1）
  - R12 每個結論都有可點來源連結（合成案例為 .invalid，檢查連結存在即可）
  - R13 新增的武斷判斷（沒有依據的斷言，次數）——修後版本不准比修前多
  - R14 開頭寫品牌歷史／背景介紹（有/無）
